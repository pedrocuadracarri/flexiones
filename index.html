<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Contador de Flexiones</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="hud">
      <div class="counter"><span id="reps">0</span><small>reps</small></div>
      <div class="chips">
        <span class="chip" id="setChip" hidden>Serie <b>1/3</b></span>
        <span class="chip">Codo <b id="elbowVal">–</b>°</span>
        <span class="chip">Cuerpo <b id="bodyVal">–</b>°</span>
        <span class="chip" id="phase">arriba</span>
      </div>
    </div>

    <button id="switchBtn" class="icon" title="Cambiar cámara" hidden>⟳</button>
    <div id="status" class="status">Pulsa Iniciar y coloca el móvil <b>de lado</b>, apoyado en el suelo.</div>
  </div>

  <div class="panel">
  <ul id="feedback" class="feedback"></ul>

  <div id="clipBox" class="clip" hidden>
    <span class="clipLabel">Peor repetición <b id="clipScore"></b></span>
    <video id="clip" playsinline muted loop controls></video>
  </div>

  <p id="suggest" class="suggest" hidden></p>

  <div class="plan">
    <label>Series <input type="number" id="setsInput" min="1" max="10" value="3"></label>
    <label>Reps <input type="number" id="targetInput" min="1" max="100" value="10"></label>
    <label>Descanso <input type="number" id="restInput" min="10" max="300" step="5" value="60">s</label>
    <label class="chk"><input type="checkbox" id="freeMode"> Libre</label>
  </div>

  <div class="controls">
    <button id="startBtn">Iniciar</button>
    <button id="skipBtn" class="ghost" hidden>Saltar descanso</button>
    <button id="stopBtn" disabled>Terminar</button>
    <button id="recalBtn" class="ghost" hidden>Recalibrar</button>
    <label class="chk"><input type="checkbox" id="voice" checked> Voz</label>
    <label class="chk"><input type="checkbox" id="haptics" checked> Vibrar</label>
  </div>
  </div>

  <details class="history">
    <summary>Progreso e historial</summary>
    <div id="progress"></div>
    <table id="historyTable">
      <thead><tr><th>Fecha</th><th>Reps</th><th>Calidad</th><th>Tiempo</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="histActions">
      <button id="exportBtn" class="link">Exportar</button>
      <button id="importBtn" class="link">Importar</button>
      <button id="clearHistory" class="link">Borrar historial</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </details>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
