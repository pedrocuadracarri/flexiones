<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flex-Up · Contador de Flexiones</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" data-screen="setup">

  <!-- ─── preparar ─────────────────────────────────────────────── -->
  <section class="screen" data-name="setup">
    <header class="hero">
      <h1><img class="logo" src="logo.png" alt="Flex-Up · Push-Up Trainer" width="478" height="411"></h1>
      <p id="suggest" class="suggest" hidden></p>
    </header>

    <div class="segmented" role="group" aria-label="Vista de la cámara">
      <button class="seg" data-view="side">De lado</button>
      <button class="seg" data-view="front">De frente</button>
    </div>

    <div class="steppers">
      <div class="stepper">
        <button class="step" data-field="sets" data-delta="-1" aria-label="Menos series">−</button>
        <div class="stepVal"><b id="setsVal">3</b><span>series</span></div>
        <button class="step" data-field="sets" data-delta="1" aria-label="Más series">+</button>
      </div>
      <div class="stepper">
        <button class="step" data-field="target" data-delta="-1" aria-label="Menos reps">−</button>
        <div class="stepVal"><b id="targetVal">10</b><span>reps por serie</span></div>
        <button class="step" data-field="target" data-delta="1" aria-label="Más reps">+</button>
      </div>
      <div class="stepper">
        <button class="step" data-field="rest" data-delta="-15" aria-label="Menos descanso">−</button>
        <div class="stepVal"><b id="restVal">60</b><span>s de descanso</span></div>
        <button class="step" data-field="rest" data-delta="15" aria-label="Más descanso">+</button>
      </div>
    </div>

    <label class="switch"><input type="checkbox" id="freeMode"> Modo libre · contar sin objetivo</label>

    <button id="startBtn" class="primary">Empezar</button>

    <div class="toggles">
      <label class="switch"><input type="checkbox" id="voice" checked> Voz</label>
      <label class="switch"><input type="checkbox" id="haptics" checked> Vibración</label>
    </div>

    <p class="tip" id="tip"></p>

    <details class="history">
      <summary>Progreso e historial</summary>
      <div id="progress"></div>
      <table id="historyTable">
        <thead><tr><th>Fecha</th><th>Reps</th><th>Calidad</th><th>Tiempo</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="histActions">
        <button id="exportBtn" class="link">Exportar</button>
        <button id="importBtn" class="link">Importar</button>
        <button id="clearHistory" class="link">Borrar</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </details>
  </section>

  <!-- ─── entrenar ─────────────────────────────────────────────── -->
  <section class="screen" data-name="workout">
    <div class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>

      <div class="gauge" aria-hidden="true">
        <div class="gaugeTarget"></div>
        <div id="gaugeFill" class="gaugeFill"></div>
      </div>

      <div class="hud">
        <div id="setBadge" class="badge">Serie 1/3</div>
        <div id="phaseBadge" class="badge phase">encuadre</div>
      </div>

      <div id="countBox" class="count">
        <span id="reps">0</span>
        <small id="repsSub">de 10</small>
      </div>

      <button id="switchBtn" class="icon" title="Cambiar cámara" hidden>⟳</button>
      <p id="coach" class="coach">Colócate en posición de plancha</p>
      <p id="debug" class="debug"></p>

      <div id="restOverlay" class="restOverlay" hidden>
        <div class="ringWrap">
          <svg class="ring" viewBox="0 0 120 120">
            <circle class="ringBg" cx="60" cy="60" r="52"/>
            <circle id="ringFg" class="ringFg" cx="60" cy="60" r="52"/>
          </svg>
          <div class="ringText"><b id="restLeft">60</b><span>descanso</span></div>
        </div>
        <p class="restNext">Siguiente: serie <b id="restNext">2/3</b></p>
        <button id="skipBtn" class="ghost">Saltar descanso</button>
      </div>
    </div>

    <div class="wControls">
      <button id="recalBtn" class="ghost">Recalibrar</button>
      <button id="stopBtn" class="ghost danger">Terminar</button>
    </div>
  </section>

  <!-- ─── resumen ──────────────────────────────────────────────── -->
  <section class="screen" data-name="summary">
    <div class="ringWrap result">
      <svg class="ring big" viewBox="0 0 120 120">
        <circle class="ringBg" cx="60" cy="60" r="52"/>
        <circle id="scoreRing" class="ringFg" cx="60" cy="60" r="52"/>
      </svg>
      <div class="ringText"><b id="scoreVal">0</b><span>calidad</span></div>
    </div>

    <div class="totals">
      <div class="tile"><b id="sumReps">0</b><span>flexiones</span></div>
      <div class="tile"><b id="sumSets">0</b><span>series</span></div>
      <div class="tile"><b id="sumTime">0s</b><span>duración</span></div>
    </div>

    <ul id="summaryList" class="feedback"></ul>

    <div id="clipBox" class="clip" hidden>
      <span class="clipLabel">Peor repetición <b id="clipScore"></b></span>
      <video id="clip" playsinline muted loop controls></video>
    </div>

    <button id="againBtn" class="primary">Otra sesión</button>
  </section>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
